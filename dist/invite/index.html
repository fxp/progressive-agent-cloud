<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>内测邀请 · Progressive Agent</title><link rel="stylesheet" href="/app/workbench.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.invite-panel{width:min(520px,100%);background:white;border:1px solid #dde1eb;padding:32px;box-sizing:border-box}.invite-panel h1{font-size:28px;margin:24px 0 16px}.invite-panel p{line-height:1.8;color:#676e82}.invite-panel .button{margin:12px 0}#invite-error{color:#a13042}#invite-login{font-size:20px;font-weight:600;color:#22253a}.invite-panel ol{padding-left:22px;line-height:2;color:#676e82}</style><script src="/invite/invite.js" defer></script></head><body><main class="invite-panel"><a class="brand" href="/">progressive<small> / agent</small></a><h1>加入邀请内测</h1><p id="invite-status" role="status">正在核对邀请…</p><p id="invite-login"></p><p id="invite-expiry"></p><button id="accept-invite" class="button" hidden>使用 GitHub 接受邀请</button><p id="invite-error" role="alert" hidden></p><ol><li>用受邀的 GitHub 账号登录</li><li>连接自己的会议来源、项目与 Agent</li><li>绑定测试仓库，接收第一条明确待办的草稿 PR</li></ol><p>会议内容、项目和密钥按用户隔离。需求不明确时会暂停，PR 由你审阅后决定是否合并。</p><a href="/app">已开通？进入工作台 →</a></main></body></html>
